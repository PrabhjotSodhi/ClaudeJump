<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="data/icons/icon-192.png" />
    <meta name="theme-color" content="#181425" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ClaudeJump</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #181425;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
      }
      #screen {
        position: fixed;
        image-rendering: pixelated;
      }

      /* The game panel art (border, fill, top highlight) drawn around the screen, one game pixel per
         step, so it lines up with the game's own pixels. */
      #screen {
        box-shadow:
          0 calc(var(--game-pixel) * -2) 0 0 #3a4466,
          0 0 0 calc(var(--game-pixel) * 3) #262b44,
          0 0 0 calc(var(--game-pixel) * 5) #3e2731;
      }
      #rotate-prompt {
        display: none;
        image-rendering: pixelated;
      }
      #webgl-message {
        display: none;
        max-width: 90vw;
        padding: 1em 1.5em;
        font: 1.1em/1.4 sans-serif;
        color: #fff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <canvas id="rotate-prompt" width="120" height="160"></canvas>
    <p id="webgl-message">
      ClaudeJump needs WebGL. Turn on graphics acceleration in your browser settings, then reload.
    </p>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
