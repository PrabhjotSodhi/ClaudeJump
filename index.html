<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClaudeJump</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f2a78;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
      }
      #webgl-message {
        display: none;
        max-width: 90vw;
        padding: 1em 1.5em;
        font: 1.1em/1.4 sans-serif;
        color: #fff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <p id="webgl-message">
      ClaudeJump needs WebGL. Turn on graphics acceleration in your browser settings, then reload.
    </p>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
