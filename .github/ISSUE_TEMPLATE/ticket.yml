name: Ticket
description: One piece of work an agent or person can pick up and finish in a single pull request.
labels:
  - ticket
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the player or maintainer gets when this is done, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Checkable statements. The ticket is done when every box can be ticked.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Related work that belongs to another ticket.
    validations:
      required: true

  - type: input
    id: filed-by
    attributes:
      label: Filed by
      description: The person, or the model and harness, that wrote this ticket.
      placeholder: opus-5.5 via Claude Code
